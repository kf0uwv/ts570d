[package]
name = "server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Network server mode: one process owns the physical serial port, exposed to WSJT-X and other remote clients over TCP/UDP."
rust-version.workspace = true

[dependencies]
# TS-570D command table + client + domain types -- this crate is
# contractually TS-570D-shaped (like `ui`), not radio-generic:
# `rigctl_radio` implements `cat_rigctl::RigctlRadio` for
# `radio::Ts570d`'s typed methods directly.
radio = { path = "../radio" }

# `CatSession`/`TransportError` -- named directly by the thin `run()`
# wrapper in `lib.rs` and by `rigctl_radio`'s trait bound.
cat-transport-core = { workspace = true }

# The request broker + raw TCP/UDP listeners this crate wires up. Fully
# cross-platform (see docs/adr/0006-windows-network-transport.md in
# radio-cat-rs) -- unlike `cat-rigctl` below, not target-gated.
cat-server = { workspace = true }

# Async traits (compatible with !Send futures for monoio).
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

[features]
default = []

# Platform-specific configuration
[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only). Windows is now a supported
# target (see docs/adr/0006-windows-concurrency-model.md) — this crate's own
# code has no direct monoio dependency outside #[monoio::test]-based unit
# tests; `cat-server` brings its own target-gated monoio.
monoio = { workspace = true }

# The generic Hamlib rigctld bridge (dispatch/dump_state/framing) +
# `run()`/`ServerConfig` orchestration -- this crate supplies only the
# radio-specific `RigctlRadio` impl (`rigctl_radio.rs`). Linux-only: unlike
# `cat-server`/`cat-transport-tcp`/`cat-transport-udp`, `cat-rigctl` has no
# Windows backend in `radio-cat-rs` yet (it uses `monoio::net`/`monoio::spawn`
# unconditionally in source, with no `#[cfg(target_os = "windows")]`
# counterpart). See `server::run`'s Windows doc comment and
# docs/adr/0006-windows-concurrency-model.md for what Windows supports
# instead (raw TCP/UDP only, no rigctld/WSJT-X bridge).
cat-rigctl = { workspace = true }
