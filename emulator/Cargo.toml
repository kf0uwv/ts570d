[package]
name = "emulator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Virtual TTY and radio emulator for TS-570D"
rust-version.workspace = true

[[bin]]
name = "emulator"
path = "src/main.rs"

[dependencies]
# Radio command table (approved architecture exception — emulator is test infrastructure)
radio = { path = "../radio" }
# Only CatFramework is used (generic dispatch engine) — approved architecture
# exception, same as the `radio` dependency above.
cat-framework = { workspace = true }

# A band of synthetic signals for the spoofed CN4 tap. The emulator serves
# rtl_tcp itself -- twelve bytes of greeting and then IQ -- so it needs no
# client crate, and deliberately no `cat-native`: the emulator is a radio,
# not a server.
cat-signal = { workspace = true }

# The radio's COM port is served as an RFC 2217 device server, because a
# pseudo-terminal carries no modem control lines and this station keys PTT
# from DTR. The protocol lives in the shared crate so the emulator's server
# and the control program's client read the same codec.
cat-transport-rfc2217 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Serialization for JSON logging
serde = { workspace = true }
serde_json = { workspace = true }

# PTY creation via serialport-rs (TTYPort::pair() creates a pseudo-terminal pair)
serialport = "4"

# Signal handling for standalone binary
ctrlc = "3.0"

# Terminal UI for LCD-style display
ratatui = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
# The tap is consumed in tests exactly as the control program will consume
# it: through the real rtl_tcp client and the real DSP. A test that read
# the emulator's own band directly would prove nothing about the wire.
cat-signal-rtlsdr = { workspace = true }
# The ACC2-IF tests drive the emulator's COM port with the same client and
# the same framing layer the control program uses -- see tests/acc2_if.rs.
cat-transport-core = { workspace = true }
cat-transport-serial = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
mockall = { workspace = true }
libc = { workspace = true }

[features]
default = []
