name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --lib --all

      - name: Integration tests
        # Requires /dev/pts (ptmx) and io_uring (kernel 5.1+).
        # ubuntu-latest runs kernel 6.x so both are available.
        run: cargo test --test integration

  windows-check:
    name: Windows cross-check
    runs-on: ubuntu-latest

    # Type-check only (no link/run) -- this repo has no Windows runner or
    # hardware to validate against; real Windows runtime behavior is
    # exercised by the release workflow's actual `windows-latest` build job
    # and, ultimately, manual testing against real hardware (see
    # docs/adr/0006-windows-concurrency-model.md's residual-risk note).
    # `emulator` is intentionally excluded: its virtual-TTY PTY hosting
    # (`serialport::TTYPort::pair()`) is Unix-only by design (see this
    # repo's own CLAUDE.md "Linux-Specific" section) and is not part of any
    # of the five Windows-support tasks this check exists to verify.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-windows-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-check-
            ${{ runner.os }}-cargo-

      - name: cargo check --target x86_64-pc-windows-gnu (workspace, excluding emulator)
        run: cargo check --target x86_64-pc-windows-gnu --workspace --exclude emulator
