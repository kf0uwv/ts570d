name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ts570d builds against a sibling checkout of radio-cat-rs: the root
  # Cargo.toml has `path = "../radio-cat-rs/..."` dependencies and a
  # [patch] pointing every radio-cat-rs crate there. So both jobs check the
  # two repositories out side by side (ts570d/ and radio-cat-rs/) and run
  # from ts570d/. This is the one place that says which radio-cat-rs to
  # build against; it must be a ref that contains everything ts570d uses
  # (cat-morse, AudioPlayback, the Windows broker fixes).
  RADIO_CAT_RS_REF: main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts570d

    steps:
      - name: Checkout ts570d
        uses: actions/checkout@v4
        with:
          path: ts570d

      - name: Checkout radio-cat-rs (sibling)
        uses: actions/checkout@v4
        with:
          repository: kf0uwv/radio-cat-rs
          ref: ${{ env.RADIO_CAT_RS_REF }}
          path: radio-cat-rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ts570d/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ts570d/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        # libhamlib-utils provides `rigctl`, the real client the rigctld
        # bridge is verified against. Both of radio-cat-rs ADR 0005's
        # interop bugs passed every unit test while failing against it.
        # libasound2-dev and librtlsdr-dev: `--all-features` below includes
        # `audio-device` (ALSA through cpal) and `sdr-device` (librtlsdr).
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libhamlib-utils libasound2-dev librtlsdr-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --lib --all

      - name: Binary unit tests
        # `--lib` skips binary targets, and the root `ts570d` package has no
        # lib target: without this, src/main.rs and src/cw/ tests (including
        # `cw copy`'s read-only safety test) ran only on the Windows job.
        run: cargo test --workspace --bins

      - name: Integration tests
        # Requires /dev/pts (ptmx) and io_uring (kernel 5.1+).
        # ubuntu-latest runs kernel 6.x so both are available.
        run: cargo test --test integration

      - name: Live Hamlib interop
        # Not covered by `--lib`, and deliberately its own step: these
        # drive a real `rigctl` against this radio's own capability set.
        #
        # EXPECT_HAMLIB turns their skip into a failure. Without it a
        # missing `rigctl` would make them pass silently, which is worse
        # than not having them -- and it is deliberately not the generic
        # `CI` variable, which is also set on the Windows runner where
        # this file does not compile at all.
        env:
          EXPECT_HAMLIB: "1"
        run: cargo test -p server --test hamlib_interop

  windows-check:
    name: Windows (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ts570d

    # Authoritative Windows verification, per `radio-cat-rs` ADR 0012.
    #
    # This supersedes the previous `cargo check --target
    # x86_64-pc-windows-gnu` cross-check on an Ubuntu runner. That job
    # type-checked a target nobody ships; this one builds AND runs the test
    # suite on a real MSVC host, which is the same toolchain the release
    # workflow packages. `x86_64-pc-windows-msvc` is the host target on
    # `windows-latest`, so no `--target` flag is needed or wanted -- passing
    # one would force a non-host build for no benefit.
    #
    # This is what finally closes the residual risk recorded in
    # docs/adr/0006-windows-concurrency-model.md and in `radio-cat-rs` ADRs
    # 0004 and 0006: the Windows code paths' *tests* have never actually
    # executed on Windows. Failures here are pre-existing bugs, not
    # regressions from this migration -- fix them, do not skip them.
    #
    # `emulator` remains excluded: its virtual-TTY PTY hosting
    # (`serialport::TTYPort::pair()`) is Unix-only by design, not by
    # toolchain (see this repo's CLAUDE.md "Linux-Specific" section).
    steps:
      - name: Checkout ts570d
        uses: actions/checkout@v4
        with:
          path: ts570d

      - name: Checkout radio-cat-rs (sibling)
        uses: actions/checkout@v4
        with:
          repository: kf0uwv/radio-cat-rs
          ref: ${{ env.RADIO_CAT_RS_REF }}
          path: radio-cat-rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ts570d/target
          key: ${{ runner.os }}-cargo-windows-msvc-${{ hashFiles('ts570d/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-msvc-
            ${{ runner.os }}-cargo-

      - name: cargo check (workspace, excluding emulator)
        run: cargo check --workspace --exclude emulator

      - name: cargo test (workspace, excluding emulator)
        run: cargo test --workspace --exclude emulator

      - name: cargo check with audio-device (cw copy's speaker, WASAPI)
        # The Windows release builds with this feature; nothing else here
        # compiles the cpal path on Windows.
        run: cargo check -p ts570d --features audio-device
