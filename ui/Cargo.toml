[package]
name = "ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ratatui terminal interface for TS-570D"
rust-version.workspace = true

[dependencies]
# Local dependencies
# TS-570D domain types + Radio trait (Frequency, Mode, InformationResponse, ...)
radio = { path = "../radio" }

# Error handling
thiserror = { workspace = true }

# Terminal UI (for framework interface definitions only)
ratatui = { workspace = true }
crossterm = { workspace = true }

# Shared console logic and terminal widgets (radio-cat-rs ADR 0011 rev 4).
# What stays in this crate is the TS-570D's LAYOUT and FEATURE SET; what
# moves out is anything with one correct answer per input. The acceptance
# bar for the migration is that the operator sees no change.
cat-ui = { workspace = true }
# Frame types (SpectrumFrame, AudioScopeFrame, AudioSpectrumFrame) and the
# capability document the console's structure is derived from. Data and
# protocol-model crates, not transports -- rule 4 forbids the latter and
# this console still names none.
cat-signal = { workspace = true }
cat-native = { workspace = true }
# The ACC2 receive-audio client. A signal source, not a transport.
cat-signal-audio = { workspace = true }
# `block_on`, to drive `SpectrumSource::next_frame` -- which blocks inside
# its own `async fn` -- on the feed's thread rather than on the console's
# single-threaded runtime. See `feeds`.
futures = { workspace = true }
cat-ui-ratatui = { workspace = true }
cat-framework = { workspace = true }

[dev-dependencies]
# `examples/screen.rs` can attach live sources, so it names the concrete
# ones. An example is the wiring layer for itself.
cat-signal-rtlsdr = { workspace = true }

[features]
default = []
# Capture the ACC2 audio from a local sound card, not only from a PCM
# server. Off by default, matching the crate that provides it: building it
# wants the platform's sound headers.
audio-device = ["cat-signal-audio/device"]

# Platform-specific configuration
[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only). `terminal::run`'s Windows
# variant drives the same two-task shape via `win_sched::block_on_two`
# instead — see docs/adr/0006-windows-concurrency-model.md.
monoio = { workspace = true }