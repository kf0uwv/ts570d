[workspace]
members = [
    "radio",
    "ui",
    "emulator",
    "server",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Matt Franklin <radiombf@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/kf0uwv/ts570d"
repository = "https://github.com/kf0uwv/ts570d"
description = "Kenwood TS-570D Radio Control with io_uring"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime (io_uring-based, Linux-only)
monoio = { version = "0.2.3" }
local-sync = "0.1.1"

# Async trait support (compatible with !Send futures for monoio)
async-trait = "0.1"

# Terminal UI
ratatui = { version = "0.26.3", features = ["crossterm"] }
crossterm = { version = "0.27.0", features = ["event-stream"] }

# Error handling
thiserror = "1.0.61"

# Serialization (for radio commands/protocols)
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Utilities
bytes = "1.6.0"
futures = "0.3.30"

# Linux-specific
libc = "0.2.153"
nix = "0.27.1"

# Testing
tempfile = "3.10.1"
mockall = "0.12.1"

# Generic CAT engine + transports, extracted from this repo into
# https://github.com/kf0uwv/radio-cat-rs (see docs/adr/0004, 0005). Pinned
# to the v0.1.0 release tag (rather than floating on `branch = "main"`) so
# this app's build is reproducible against a known-good, released snapshot
# of the shared library.
cat-framework = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-ui = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-ui-ratatui = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-client = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-transport-core = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-transport-serial = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-transport-tcp = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-transport-udp = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-server = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }
cat-rigctl = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.3.0" }

[package]
name = "ts570d"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
rust-version.workspace = true

[[bin]]
name = "ts570d"
path = "src/main.rs"

# Bench helper for DTR/RTS PTT-line troubleshooting (planning/ptt-line).
# Same wiring layer as main.rs: allowed to name concrete transport types.
[[bin]]
name = "ts570d-line"
path = "src/bin/line.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Async trait support (compatible with !Send futures for monoio on Linux;
# also used by `TcpClientSession`'s CatSession impl on every platform).
async-trait = { workspace = true }

# CAT transport crates (extracted; see docs/adr/0004, 0005) — provide
# SerialCatSession/SerialConfig/SerialPort (--port, local serial) and
# TcpCatSession (--server, TCP client mode — see
# docs/adr/0006-windows-concurrency-model.md). cat-transport-core is named
# directly now too, for `TcpClientSession`'s CatSession<Error =
# TransportError> adapter impl in main.rs (see Rule 5: main.rs is the only
# place concrete transport types are wired together).
cat-transport-serial = { workspace = true }
cat-transport-tcp = { workspace = true }
cat-transport-core = { workspace = true }

# Local workspace crates
radio = { path = "radio" }
ui = { path = "ui" }
server = { path = "server" }

[dev-dependencies]
radio    = { path = "radio" }
cat-transport-serial = { workspace = true }

[features]
default = []

# Platform-specific configuration
[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only). Windows drives the same
# run_app() future via win_runtime::block_on instead — see
# docs/adr/0006-windows-concurrency-model.md.
monoio = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# tests/integration.rs exercises the io_uring serial driver directly and is
# itself gated `#![cfg(target_os = "linux")]`.
monoio = { workspace = true }
# The emulator is fundamentally Unix-only (pseudo-terminals via
# serialport::TTYPort, std::os::unix::io::AsRawFd) — not a monoio/io_uring
# limitation, so it is not part of this repo's Windows port at all (see
# docs/adr/0006-windows-concurrency-model.md's scope). Only
# tests/integration.rs uses it, and that file is itself Linux-gated above.
emulator = { path = "emulator" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

# Metadata for documentation and packaging
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

# Build requirements documentation
[package.metadata.build]
# Note: This application requires Linux kernel 5.1+ for io_uring support
# Build command: cargo build --release
# Test command: cargo test
# Lint command: cargo clippy && cargo fmt
