[workspace]
members = [
    "radio",
    "ui",
    "emulator",
    "server",
    "gui",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Matt Franklin <radiombf@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/kf0uwv/ts570d"
repository = "https://github.com/kf0uwv/ts570d"
description = "Kenwood TS-570D Radio Control with io_uring"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime (io_uring-based, Linux-only)
# `sync` is required, not optional. `cat-transport-rfc2217`'s reader thread
# wakes the task suspended in `Transport::read` from a different OS thread,
# and monoio's waker panics on a cross-thread wake unless this is enabled:
#   "waker can only be sent across threads when `sync` feature enabled"
# Nothing catches this in a test — `futures::executor::block_on`'s waker is
# thread-safe, so only the real app under `#[monoio::main]` hits it.
monoio = { version = "0.2.3", features = ["sync"] }
local-sync = "0.1.1"

# Async trait support (compatible with !Send futures for monoio)
async-trait = "0.1"

# Terminal UI
ratatui = { version = "0.26.3", features = ["crossterm"] }
# Immediate-mode GUI on wgpu (ADR 0008). `eframe` is the windowing shell;
# `cat-ui-egui` depends on `egui` alone, which is what keeps the shared
# widgets usable from a host that is not eframe.
# `default-features = false` drops glow (we render through wgpu), but it
# also drops winit's platform backends -- without x11/wayland the build
# fails inside winit with "the platform you're compiling for is not
# supported", which reads like a toolchain problem and is not one.
eframe = { version = "0.29", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.29"
crossterm = { version = "0.27.0", features = ["event-stream"] }

# Error handling
thiserror = "1.0.61"

# Serialization (for radio commands/protocols)
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Utilities
bytes = "1.6.0"
futures = "0.3.30"

# Linux-specific
libc = "0.2.153"
nix = "0.27.1"

# Testing
tempfile = "3.10.1"
mockall = "0.12.1"

# Generic CAT engine + transports, extracted from this repo into
# https://github.com/kf0uwv/radio-cat-rs (see docs/adr/0004, 0005). Pinned
# to the v0.1.0 release tag (rather than floating on `branch = "main"`) so
# this app's build is reproducible against a known-good, released snapshot
# of the shared library.
cat-framework = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-native = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
# How a radio's console is arranged. A path dependency for the same reason
# as the others in this block: not in a tagged release yet.
cat-layout = { path = "../radio-cat-rs/cat-layout" }
cat-ui-egui = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-signal = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-signal-rtlsdr = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
# The ACC2 receive-audio client (radio-cat-rs ADR 0017). New alongside
# cat-transport-rfc2217 and covered by the same temporary [patch].
cat-signal-audio = { path = "../radio-cat-rs/cat-signal-audio" }
cat-ui = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-ui-ratatui = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-client = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-transport-core = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-transport-serial = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-transport-tcp = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
# RFC 2217: a serial port WITH its modem control lines, over TCP. New in
# radio-cat-rs and not yet in a release, so it is a path dependency and the
# [patch] below points every other radio-cat-rs crate at the same local
# checkout -- otherwise two copies of cat-transport-core would exist and
# `impl Transport for Rfc2217Port` would not satisfy `SerialCatSession`.
# TEMPORARY: revert to a tagged git dependency once radio-cat-rs cuts the
# release containing this crate.
cat-transport-rfc2217 = { path = "../radio-cat-rs/cat-transport-rfc2217" }
cat-transport-udp = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-server = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }
cat-rigctl = { git = "https://github.com/kf0uwv/radio-cat-rs", tag = "v0.7.3" }

# TEMPORARY local patch -- see cat-transport-rfc2217 above. Every
# radio-cat-rs crate is redirected to the sibling checkout so exactly one
# copy of each is linked. Remove this whole section, and restore
# cat-transport-rfc2217 to a `git`/`tag` dependency, when the library is
# released.
[patch."https://github.com/kf0uwv/radio-cat-rs"]
cat-framework = { path = "../radio-cat-rs/cat-framework" }
cat-native = { path = "../radio-cat-rs/cat-native" }
cat-ui-egui = { path = "../radio-cat-rs/cat-ui-egui" }
cat-signal = { path = "../radio-cat-rs/cat-signal" }
cat-signal-rtlsdr = { path = "../radio-cat-rs/cat-signal-rtlsdr" }
cat-ui = { path = "../radio-cat-rs/cat-ui" }
cat-ui-ratatui = { path = "../radio-cat-rs/cat-ui-ratatui" }
cat-client = { path = "../radio-cat-rs/cat-client" }
cat-transport-core = { path = "../radio-cat-rs/cat-transport-core" }
cat-transport-serial = { path = "../radio-cat-rs/cat-transport-serial" }
cat-transport-tcp = { path = "../radio-cat-rs/cat-transport-tcp" }
cat-transport-udp = { path = "../radio-cat-rs/cat-transport-udp" }
cat-server = { path = "../radio-cat-rs/cat-server" }
cat-rigctl = { path = "../radio-cat-rs/cat-rigctl" }

[package]
name = "ts570d"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
rust-version.workspace = true

[[bin]]
name = "ts570d"
path = "src/main.rs"

# Bench helper for DTR/RTS PTT-line troubleshooting (planning/ptt-line).
# Same wiring layer as main.rs: allowed to name concrete transport types.
[[bin]]
name = "ts570d-line"
path = "src/bin/line.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Async trait support (compatible with !Send futures for monoio on Linux;
# also used by `TcpClientSession`'s CatSession impl on every platform).
async-trait = { workspace = true }

# CAT transport crates (extracted; see docs/adr/0004, 0005) — provide
# SerialCatSession/SerialConfig/SerialPort (--port, local serial) and
# TcpCatSession (--server, TCP client mode — see
# docs/adr/0006-windows-concurrency-model.md). cat-transport-core is named
# directly now too, for `TcpClientSession`'s CatSession<Error =
# TransportError> adapter impl in main.rs (see Rule 5: main.rs is the only
# place concrete transport types are wired together).
cat-transport-serial = { workspace = true }
cat-transport-tcp = { workspace = true }
cat-transport-core = { workspace = true }
# `--rfc2217`: a serial port on a device server, with its modem control
# lines. Named here because main.rs is the only place a concrete transport
# is chosen (Rule 5).
cat-transport-rfc2217 = { workspace = true }
# The radio's other two interfaces: the CN4 IF tap over `rtl_tcp`, and the
# ACC2 receive-audio pair. Named here because main.rs is the only place a
# concrete source is chosen (Rule 5).
cat-signal = { workspace = true }
cat-signal-rtlsdr = { workspace = true }
cat-signal-audio = { workspace = true }
# The console protocol, for `--server`. Also a transport choice, and so
# also this layer's to make (Rule 5).
cat-native = { workspace = true }

# Local workspace crates
radio = { path = "radio" }
ui = { path = "ui" }
server = { path = "server" }

# The calibration snapshot is written and read as JSON here; the type and
# its meaning live in `radio::calibration`.
serde_json = { workspace = true }

[dev-dependencies]
radio    = { path = "radio" }
# src/port_guard.rs's tests open a real file and look for themselves in
# /proc, which needs somewhere disposable to put it.
tempfile = { workspace = true }
cat-transport-serial = { workspace = true }
# tests/rfc2217_under_monoio.rs -- the guard for the monoio `sync` feature.
cat-transport-rfc2217 = { workspace = true }

[features]
default = []

# Open a local RTL-SDR directly, rather than reaching one over `rtl_tcp`.
#
# Off by default for the reason radio-cat-rs ADR 0014 gives for its own
# `device` feature: building it wants librtlsdr, and making everyone who
# compiles this program acquire a C toolchain for hardware they may not own
# is a poor trade. Without it, `--if-out rtl:<n>` reports what to do
# instead rather than silently doing nothing.
sdr-device = ["cat-signal-rtlsdr/device"]

# Capture the ACC2 receive audio from a local sound card. Off by default for
# the same reason: it wants the platform's sound headers (ALSA on Linux).
# Without it, `--acc2-audio audio:<name>` reports what to do instead, and
# the SOURCE tab says why its audio list is empty rather than implying this
# machine has no sound cards.
# `server/audio-device` too: this is one program, and an operator who
# built it for sound cards means the whole of it -- a `ts570d server` that
# could not open the card `ts570d` just opened would be a baffling way to
# spend an evening.
audio-device = [
    "cat-signal-audio/device",
    "ui/audio-device",
    "server/audio-device",
]

# Platform-specific configuration
[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only). Windows drives the same
# run_app() future via win_runtime::block_on instead — see
# docs/adr/0006-windows-concurrency-model.md.
monoio = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# tests/integration.rs exercises the io_uring serial driver directly and is
# itself gated `#![cfg(target_os = "linux")]`.
monoio = { workspace = true }
# tests/ptt_line.rs drives the emulator's RFC 2217 COM port, which is a
# socket and a reader thread rather than an io_uring registration, so there
# is no monoio runtime in that test to await the one CAT query it makes.
futures = { workspace = true }
# The emulator is fundamentally Unix-only (pseudo-terminals via
# serialport::TTYPort, std::os::unix::io::AsRawFd) — not a monoio/io_uring
# limitation, so it is not part of this repo's Windows port at all (see
# docs/adr/0006-windows-concurrency-model.md's scope). Only
# tests/integration.rs uses it, and that file is itself Linux-gated above.
emulator = { path = "emulator" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

# Metadata for documentation and packaging
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

# Build requirements documentation
[package.metadata.build]
# Note: This application requires Linux kernel 5.1+ for io_uring support
# Build command: cargo build --release
# Test command: cargo test
# Lint command: cargo clippy && cargo fmt
