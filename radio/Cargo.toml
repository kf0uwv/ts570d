[package]
name = "radio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kenwood TS-570D protocol handling"
rust-version.workspace = true

[dependencies]
# Generic CAT engine + client mechanics (extracted; see docs/adr/0004, 0005)
cat-framework = { workspace = true }
cat-client = { workspace = true }
cat-transport-core = { workspace = true }

# Async traits
async-trait = "0.1"

# Error handling
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }
# Test-only: SerialCatSession, wrapped around a local FakeTransport, for
# wire-framing-level unit tests in ts570d.rs. Never used by production code
# (radio never depends on a concrete transport).
cat-transport-serial = { workspace = true }

[features]
default = []

# Platform-specific configuration
[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only). Only used by this crate's own
# #[monoio::test]-based unit tests today (production code has no direct
# monoio dependency) — see docs/adr/0006-windows-concurrency-model.md.
monoio = { workspace = true }
