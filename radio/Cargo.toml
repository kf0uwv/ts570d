[package]
name = "radio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kenwood TS-570D protocol handling"
rust-version.workspace = true

[dependencies]
# Generic CAT engine + client mechanics (extracted; see docs/adr/0004, 0005)
cat-framework = { workspace = true }
# The signal vocabulary this radio's declaration is written in: an IF tap
# point is a `cat-signal` concept, and `capabilities` re-exports the types
# so a consumer names one crate rather than three to describe one bench.
cat-signal = { workspace = true }
# The console arrangement this radio asks for. A declaration about the
# rig, like `capabilities`, and it lives beside it for the same reason.
cat-layout = { workspace = true }
cat-client = { workspace = true }
cat-transport-core = { workspace = true }

# Async traits
async-trait = "0.1"

# Error handling
thiserror = { workspace = true }

# The calibration snapshot is a file an operator keeps and reads. JSON so
# it is legible without a tool, and so a gap in it is visible rather than
# implied.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }
# Test-only: SerialCatSession, wrapped around a local FakeTransport, for
# wire-framing-level unit tests in ts570d.rs. Never used by production code
# (radio never depends on a concrete transport).
cat-transport-serial = { workspace = true }
# Test-only: the terminal console's own `natural` density, so the layout
# test checks the number that renderer actually uses rather than a copy of
# it that can drift. This crate never depends on a renderer otherwise --
# a radio describes its console, it does not draw it.
cat-ui-ratatui = { workspace = true }
# Test-only, alongside cat-ui-ratatui above: the density a renderer asks
# for depends on this radio's declared meters, and the wire form is what a
# renderer is handed.
cat-native = { workspace = true }

[features]
default = []

# Platform-specific configuration
[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only). Only used by this crate's own
# #[monoio::test]-based unit tests today (production code has no direct
# monoio dependency) — see docs/adr/0006-windows-concurrency-model.md.
monoio = { workspace = true }
